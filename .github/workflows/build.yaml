name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; individual jobs opt into more if needed.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # dtolnay/rust-toolchain pinned to commit SHA (third-party action).
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
        components: rustfmt, clippy
    # Swatinem/rust-cache pinned to commit SHA (third-party action).
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Install prek
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/latest/download/prek-installer.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Run prek
      run: prek run --config .pre-commit-config.actions.yaml --all-files --show-diff-on-failure

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
        components: rustfmt
    - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
        components: clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    # Lint levels are enforced centrally via the [lints] table in Cargo.toml.
    - run: cargo clippy --all-targets --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # Must match rust-version in Cargo.toml. The latest dependency set
    # (vergen-gix 10, sysinfo 0.39) has a real floor of 1.96.
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: "1.96"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - run: cargo check --all-targets --all-features

  test:
    runs-on: ${{ matrix.os.long }}
    strategy:
      matrix:
        # Integration tests drive shell-script fixtures through `bash`
        # (see tests/fixture/mod.rs), so they require a POSIX shell and are
        # not run on Windows. Windows is still covered by the `build` job.
        os:
        - long: ubuntu-latest
          short: linux
        - long: macOS-latest
          short: mac
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - run: cargo build --tests
    - run: cargo test --all
      shell: bash
      env:
        RUST_LOG: trace
        RUST_BACKTRACE: 1

  build:
    runs-on: ${{ matrix.os.long }}
    strategy:
      matrix:
        os:
        - long: ubuntu-latest
          short: linux
        - long: macOS-latest
          short: mac
        - long: windows-latest
          short: win
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - run: cargo build
    - name: Archive
      shell: bash
      working-directory: target/debug
      run: |
        VERSION=$(./git-secat --version | cut -d ' ' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        rm -rf artifacts
        mkdir -p artifacts
        cp 'git-secat' artifacts/
        echo '${{github.sha}} ${{github.ref}}' | tee artifacts/git-ref
        if command -v sha256sum; then
            sha256sum 'git-secat' | tee artifacts/sha256sums
        else
            shasum -a 256 'git-secat' | tee artifacts/sha256sums
        fi

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: git-secat-${{matrix.os.short}}-${{env.VERSION}}
        path: target/debug/artifacts/

  docs-are-up-to-date:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - run: ./build-man.sh build
    - run: ./build-man.sh run
    - name: Check docs are up-to-date
      run: git diff --exit-code HEAD -- docs
