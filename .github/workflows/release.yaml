name: Release

on:
  push:
    tags:
    - v*

permissions:
  contents: read

jobs:
  upload-artifacts:
    runs-on: ${{ matrix.os.long }}
    strategy:
      matrix:
        os:
        - long: ubuntu-latest
          short: linux
        - long: macOS-latest
          short: mac
        - long: windows-latest
          short: win
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - run: cargo build --release
    - name: Archive
      shell: bash
      working-directory: target/release
      run: |
        VERSION="${{github.ref}}"
        VERSION="${VERSION#refs/tags/}"
        ARCHIVE="git-secat-${{matrix.os.short}}-$VERSION.tgz"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

        rm -rf artifacts
        mkdir -p artifacts/git-secat
        cp 'git-secat' artifacts/git-secat/
        echo '${{github.sha}} ${{github.ref}}' | tee artifacts/git-secat/git-ref

        if command -v sha256sum; then
            sha256sum 'git-secat' | tee artifacts/git-secat/sha256sums
        else
            shasum -a 256 'git-secat' | tee artifacts/git-secat/sha256sums
        fi

        cd artifacts
        tar cvzf "$ARCHIVE" git-secat
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: git-secat-${{matrix.os.short}}-${{env.VERSION}}
        path: target/release/artifacts/${{env.ARCHIVE}}

  github-release:
    needs:
    - upload-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Resolve version
      run: |
        VERSION="${{github.ref}}"
        VERSION="${VERSION#refs/tags/}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: git-secat-*-${{env.VERSION}}
        path: ./dist
        merge-multiple: true
    - name: Create GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: true
        files: ./dist/*.tgz

  cargo-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Cargo publish
      run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
